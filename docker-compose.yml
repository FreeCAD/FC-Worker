services:
  redis:
    image: redis:alpine

  api:
    build:
      context: .
      dockerfile: ./Dockerfile.api
    depends_on:
      - redis
    ports:
      - "9000:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  kicad-3dmodels:
    build:
      context: .
      dockerfile: ./Dockerfile.celery
    command: ["sh", "scripts/fetch-kicad-3dmodels.sh", "/usr/share/kicad/3dmodels"]
    restart: "no"
    volumes:
      - ${KICAD_3DMODELS_VOLUME:-kicad_3dmodels}:/usr/share/kicad/3dmodels

  celery-worker:
    build:
      context: .
      dockerfile: ./Dockerfile.celery
    depends_on:
      redis:
        condition: service_started
      kicad-3dmodels:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:3030}
      - KICAD_3D_LIBRARIES=/usr/share/kicad/3dmodels
    # bubblewrap (RUN_CODE_SNIPPET sandbox) needs CAP_SYS_ADMIN + writable cgroup.
    privileged: true
    volumes:
      - ${KICAD_3DMODELS_VOLUME:-kicad_3dmodels}:/usr/share/kicad/3dmodels
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kicad_3dmodels:
    name: kicad_3dmodels
